<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Galaxy - Bất Ngờ Cho Chủ Tịch</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        /* Ẩn video webcam đi, chỉ lấy data */
        .input_video { display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <video class="input_video"></video>
    <script>
        // ==========================================
        // 1. SETUP THREE.JS (MÔI TRƯỜNG 3D THỰC THỤ)
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15; // Góc nhìn camera

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. TẠO HẠT 3D (PARTICLES)
        // ==========================================
        const particleCount = 3000; // 3000 hạt 3D siêu mượt
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 20;     // x
            positions[i * 3 + 1] = (Math.random() - 0.5) * 20; // y
            positions[i * 3 + 2] = (Math.random() - 0.5) * 20; // z
            velocities.push({ x: 0, y: 0, z: 0, angle: Math.random() * Math.PI * 2, radius: Math.random() * 3 + 2 });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Tự tạo một đốm sáng tròn mờ (Glow effect) thay vì hạt vuông
        const canvas = document.createElement('canvas');
        canvas.width = 16; canvas.height = 16;
        const context = canvas.getContext('2d');
        const gradient = context.createRadialGradient(8, 8, 0, 8, 8, 8);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.2, 'rgba(0, 255, 200, 1)'); // Màu xanh ngọc / Ocean
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, 16, 16);
        const texture = new THREE.CanvasTexture(canvas);

        const material = new THREE.PointsMaterial({
            size: 0.4,
            map: texture,
            transparent: true,
            blending: THREE.AdditiveBlending, // Cộng gộp ánh sáng tạo hiệu ứng Neon
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // ==========================================
        // 3. NHẬN DIỆN TAY BẰNG MEDIAPIPE AI
        // ==========================================
        const videoElement = document.querySelector('.input_video');
        let targetX = 0, targetY = 0;
        let currentGesture = "SPHERE"; // Mặc định là khối cầu xoay

        const hands = new window.Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Map tọa độ MediaPipe (0 -> 1) sang tọa độ Three.js 3D
                targetX = (landmarks[9].x - 0.5) * 30; // Trục X bị lật gương
                targetY = -(landmarks[9].y - 0.5) * 20; // Trục Y ngược chiều
                
                // LOGIC CỬ CHỈ (GIỐNG Y HỆT VIDEO)
                let fingersOpen = 0;
                const tips = [8, 12, 16, 20];
                const pips = [6, 10, 14, 18];
                for (let i = 0; i < 4; i++) {
                    if (landmarks[tips[i]].y < landmarks[pips[i]].y) fingersOpen++;
                }

                const indexUp = landmarks[8].y < landmarks[6].y;
                const pinkyUp = landmarks[20].y < landmarks[18].y;
                const middleUp = landmarks[12].y < landmarks[10].y;
                const ringUp = landmarks[16].y < landmarks[14].y;

                if (fingersOpen === 0) {
                    currentGesture = "GATHER"; // Nắm tay
                } else if (indexUp && pinkyUp && !middleUp && !ringUp) {
                    currentGesture = "RAIN"; // Búng tay Spider-man
                } else if (fingersOpen >= 4) {
                    currentGesture = "EXPLODE"; // Xòe tay nổ
                } else if (indexUp && middleUp) {
                    currentGesture = "SPHERE"; // 2 ngón điều khiển khối cầu
                    targetX = ((landmarks[8].x + landmarks[12].x)/2 - 0.5) * 30;
                    targetY = -((landmarks[8].y + landmarks[12].y)/2 - 0.5) * 20;
                } else {
                    currentGesture = "SPHERE"; 
                }
            }
        });

        const cameraAI = new window.Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 320, height: 640
        });
        cameraAI.start();

        // ==========================================
        // 4. VÒNG LẶP VẬT LÝ VÀ RENDER 3D
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            const positions = particleSystem.geometry.attributes.position.array;

            for (let i = 0; i < particleCount; i++) {
                let px = positions[i * 3];
                let py = positions[i * 3 + 1];
                let pz = positions[i * 3 + 2];
                let v = velocities[i];

                let dx = targetX - px;
                let dy = targetY - py;
                let dz = 0 - pz; // Mục tiêu Z luôn là 0 (ngang mặt phẳng tay)
                let dist = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;

                if (currentGesture === "SPHERE") {
                    v.angle += 0.05;
                    let desiredX = targetX + Math.cos(v.angle + i) * v.radius;
                    let desiredY = targetY + Math.sin(v.angle + i) * v.radius;
                    let desiredZ = Math.sin(v.angle * 2 + i) * (v.radius / 2); // Tạo độ sâu 3D thật

                    v.x += (desiredX - px) * 0.05;
                    v.y += (desiredY - py) * 0.05;
                    v.z += (desiredZ - pz) * 0.05;
                    
                    v.x *= 0.9; v.y *= 0.9; v.z *= 0.9; // Ma sát
                } 
                else if (currentGesture === "EXPLODE") {
                    let force = 20 / dist;
                    v.x -= (dx / dist) * force;
                    v.y -= (dy / dist) * force;
                    v.z -= (dz / dist) * force;
                    v.x *= 0.95; v.y *= 0.95; v.z *= 0.95;
                }
                else if (currentGesture === "GATHER") {
                    let pull = dist * 0.02;
                    v.x += (dx / dist) * pull;
                    v.y += (dy / dist) * pull;
                    v.z += (dz / dist) * pull;
                    v.x *= 0.8; v.y *= 0.8; v.z *= 0.8;
                }
                else if (currentGesture === "RAIN") {
                    v.y -= 0.5; // Rơi xuống
                    v.x *= 0.5; v.z *= 0.5;
                    if (py < -15) { // Chạm đáy màn hình
                        positions[i * 3 + 1] = 15; // Lên lại đỉnh
                        positions[i * 3] = (Math.random() - 0.5) * 30;
                        v.y = -(Math.random() * 0.5 + 0.1);
                    }
                }

                // Cập nhật vị trí
                if (currentGesture !== "RAIN") {
                    positions[i * 3] += v.x;
                    positions[i * 3 + 1] += v.y;
                    positions[i * 3 + 2] += v.z;
                } else {
                    positions[i * 3 + 1] += v.y; // Chỉ rơi trục Y
                }
            }

            particleSystem.geometry.attributes.position.needsUpdate = true;
            
            // Xoay từ từ toàn bộ camera để tạo cảm giác không gian 3D bồng bềnh
            scene.rotation.y += 0.002; 
            scene.rotation.x += 0.001;

            renderer.render(scene, camera);
        }

        animate();

        // Responsive khi thay đổi kích thước cửa sổ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
